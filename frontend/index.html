<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App - Shops</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html" class="active">Shop</a> |
        <a href="shopping_cart.html">Shopping Cart</a> |
        <a href="history.html">History</a> |
        <a href="coupons.html">Coupons</a>
    </nav>
</header>

<main class="layout">
    <aside class="shops-sidebar">
        <h3>Shops:</h3>
        <select id="rating-filter" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #d1d5db;">
            <option value="">All ratings</option>
            <option value="4.8">Rating 4.8+</option>
            <option value="4.7">Rating 4.7+</option>
            <option value="4.5">Rating 4.5+</option>
        </select>

        <div id="shops-list">
            <p>Loading stores...</p>
        </div>
    </aside>

    <section class="products-section">
        <div class="filters-bar" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <select id="category-filter" style="padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #d1d5db;">
                <option value="">All categories</option>
                <option value="1">Burgers</option>
                <option value="2">Drinks</option>
                <option value="3">Desserts</option>
            </select>

            <select id="sort-select" style="padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #d1d5db;">
                <option value="-">By default</option>
                <option value="price-asc">Price (Low to High)</option>
                <option value="price-desc">Price (High to Low)</option>
                <option value="name-asc">Alphabetical (A-Z)</option>
                <option value="name-desc">Alphabetical (Z-A)</option>
            </select>
        </div>

        <div id="products-list" class="products-grid">
            <p class="empty-msg">Оберіть магазин, щоб побачити товари.</p>
        </div>
    </section>
</main>

<script src="app.ts" type="module"></script>
</body>
</html>
