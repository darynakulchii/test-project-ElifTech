<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App - Cart</title>
<!--    <script src="https://cdn.tailwindcss.com"></script>-->
    <link rel="stylesheet" href="main.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html">Shop</a> |
        <a href="shopping_cart.html" class="active">Shopping Cart</a> |
        <a href="history.html">History</a> |
        <a href="coupons.html">Coupons</a>
    </nav>
</header>

<main class="cart-layout">
    <section class="user-form-section">
        <form id="order-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="coupon">Promo code:</label>
                <input type="text" id="coupon" name="coupon">
            </div>
        </form>
    </section>

    <section class="cart-items-section">
        <div id="cart-items-list" class="cart-list">
            <p>Your cart is empty</p>
        </div>

        <div class="cart-summary">
            <h3 id="total-price-display">Total price: 0</h3>
            <button type="submit" form="order-form" id="submit-order-btn">Submit</button>
        </div>
    </section>
</main>

<script src="app.ts" type="module"></script>
</body>
</html>
