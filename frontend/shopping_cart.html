<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App - Cart</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<header>
    <nav>
        <a href="index.html">Shop</a> |
        <a href="shopping_cart.html" class="active">Shopping Cart</a> |
        <a href="history.html">History</a> |
        <a href="coupons.html">Coupons</a>
    </nav>
</header>

<main class="cart-layout">
    <section class="user-form-section">
        <form id="order-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required placeholder="+380xxxxxxxxx" pattern="[\+]\d{10,12}|[0-9]{10}">
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required placeholder="Kyiv, Khreshchatyk 1">
            </div>
            <div class="form-group">
                <label for="coupon">Promo code:</label>
                <input type="text" id="coupon" name="coupon" placeholder="Введіть код та натисніть поруч">
            </div>
        </form>
    </section>

    <section class="cart-items-section">
        <div id="cart-items-list" class="cart-list" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <p>Your cart is empty</p>
        </div>

        <div class="cart-summary" style="border-top: 2px solid #f9fafb; padding-top: 1rem; text-align: right;">
            <h3 id="total-price-display" style="margin-bottom: 1rem;">Total price: 0.00 ₴</h3>
            <button type="submit" form="order-form" id="submit-order-btn" class="btn-primary">Submit Order</button>
        </div>
    </section>
</main>

<script src="app.ts" type="module"></script>
</body>
</html>
